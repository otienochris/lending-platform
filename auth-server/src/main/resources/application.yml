server:
  port: 4011
spring:
  application:
    name: auth-server
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  r2dbc:
    url: r2dbc:postgresql://localhost:5432
    name: crm
    username: apis
    password: apis
    pool:
      enabled: true
      max-size: 100
      initial-size: 5
      max-idle-time: 30m
      #Set Database Connection Request Timeout to 60secs and maximum connections to 500
      connection-timeout: 60000
      maximum-pool-size: 100
  logging:
    pattern:
      file: "%d{yyyy-MM-dd HH:mm:ss.SSS} | severity=%5p | application=${spring.application.name} | thread=%15.15t | %m%n"
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} | severity=%5p | application=${spring.application.name} | thread=%15.15t | %m%n"
    file:
      name: logs/${spring.application.name}.logs
eureka:
  client:
    registerWithEureka: false
    fetchRegistry: false
    service-url:
      defaultZone: ${EUREKA_PATH}
logging:
  level:
    web: debug
  file: logs/${spring.application.name}.logs
  max-size: 10MB
  max-history: 30
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} | severity=%5p | application=${spring.application.name} | thread=%15.15t | %m%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} | severity=%5p | application=${spring.application.name} | thread=%15.15t | %m%n"
app:
  service-properties:
    auth-server-properties:
      kafka-configs:
        topics-for-command:
          USER_VALIDATION_COMMAND: "user.validation.command"
          USER_VALIDATION_EVENT: "user.validation.event"
  securityConfigSpec:
    whitelistedPaths:
      - "/.well-known/jwks.json"
      - "/.well-known/openid-configuration"
      - "/api/v1/auth/**"
      - "/api/v1/public/**"
      - "/actuator/health"
      - "/actuator/info"
      - "/v3/api-docs/**"
      - "/swagger-ui.html"
      - "/swagger-ui/**"
      - "/webjars/**"
      - "/oauth/token"
      - "/api/v1/users"

    jwtSpec:
      secret: dev-jwt-256-bit-secret-must-be-at-least-32-char
      expiration: 36000
      refreshExpiration: 4000
      issuer: http://localhost:4011
    password-spec:
      passwordLength: 12
auth:
  security:
    password-encoder:
      strength: 12
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true
    rate-limit:
      login-attempts: 5
      lock-time-minutes: 30
