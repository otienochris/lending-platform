jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    port: 8089
    enabled: true
  database:
    table-prefix: scheduler.
    database-name: lending_platform
    datasource: jobrunrDataSource
  jobs:
    default-number-of-retries: 3
  job-scheduler:
    enabled: true



