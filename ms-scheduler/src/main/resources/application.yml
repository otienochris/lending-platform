server:
  port: 8088
spring:
  application:
    name: ms-scheduler
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/lending_platform
    username: apis
    password: apis
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  r2dbc:
    url: r2dbc:postgresql://localhost:5432
    name: lending_platform
    username: apis
    password: apis
    pool:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: scheduler
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          #          issuer-uri: ${misc.keycloak.baseurl}/realms/${misc.keycloak.realm}
          issuer-uri: http://localhost:4011
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/.well-known/jwks.json
      client:
        registration:
          keycloak:
            client-id: ${sping.application.name}
            authorization-grant-type: authorization_code
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
            user-name-attribute: preferred_username
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: false
    fetch-registry: false


logging:
  #  level:
  #    org.springframework.r2dbc.core: DEBUG
  #    org.springframework.data.r2dbc: DEBUG
  #    io.r2dbc.spi: DEBUG
  file: logs/${spring.application.name}.logs
  max-size: 10MB
  max-history: 30
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} | severity=%5p | application=${spring.application.name} | thread=%15.15t | %m%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} | severity=%5p | application=${spring.application.name} | thread=%15.15t | %m%n"



app:
  service-properties:
    scheduler-properties:
      job-runner-config:
        datasource:
          url: jdbc:postgresql://localhost:5432/lending_platform
          username: apis
          password: apis
          driverClassName: org.postgresql.Driver
      kafka-configs:
        topics-for-command:
          DISBURSE_COMMAND: "loan.disbursement.command"
          DISBURSE_EVENT: "loan.disbursement.event"
          REPAYMENT_COMMAND: "loan.repayment.command"
          ACTUAL_REPAYMENT_COMMAND: "loan.repayment.command"
          REPAYMENT_EVENT: "loan.repayment.event"
          REPAYMENT_SCHEDULING_COMMAND: "loan.repayment.scheduling.command"
          REPAYMENT_SCHEDULING_EVENT: "loan.repayment.scheduling.event"
          REPAYMENT_PREVALIDATION_COMMAND: "loan.repayment.prevalidation.command"
          REPAYMENT_PREVALIDATION_EVENT: "loan.repayment.prevalidation.event"
          NOTIFY_COMMAND: "notification.command"
          PRODUCT_VALIDATION_COMMAND: "product.validation.command"
          USER_VALIDATION_COMMAND: "user.validation.command"
          NOTIFY_EVENT: "notification.event"
          PRODUCT_VALIDATION_EVENT: "product.validation.event"
          USER_VALIDATION_EVENT: "user.validation.event"


      securityConfigSpec:
        whitelistedPaths:
          - "/actuator/health"
          - "/actuator/info"
          - "/v3/api-docs/**"
          - "/swagger-ui.html"
          - "/swagger-ui/**"
          - "/webjars/**"
        corsConfigs:
          - mapping: "/**"
            allowed-origins:
              - http://localhost:3000
              - http://localhost:8080
            allowed-methods:
              - GET
              - POST
              - OPTION
              - DELETE
              - PUT
            allowed-headers:
              - "*"
            allow-credentials: true
        jwtSpec:
          resourceId: ${spring.application.name}
          principalAttribute: preferred_username
          issuerUri: http://localhost:4011
          jwkSetUri: ${app.service-properties.scheduler-properties.securityConfigSpec.jwtSpec.issuerUri}/.well-known/jwks.json


